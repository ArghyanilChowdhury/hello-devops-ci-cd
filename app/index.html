<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Quiz</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .quiz-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #1f4e79;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border: none;
      background: #1f4e79;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="quiz-box">
  <h2>DevOps Quiz</h2>

  <p id="question">What does CI stand for?</p>

  <button onclick="checkAnswer('a')">Continuous Integration</button>
  <button onclick="checkAnswer('b')">Code Inspection</button>
  <button onclick="checkAnswer('c')">Central Infrastructure</button>

  <p id="result"></p>
</div>

<script>
function checkAnswer(answer) {
  if (answer === 'a') {
    document.getElementById('result').innerText = "Correct!";
  } else {
    document.getElementById('result').innerText = "Wrong Answer!";
  }
}
</script>

</body>
</html>
